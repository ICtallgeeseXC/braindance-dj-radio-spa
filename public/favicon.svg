<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ff003c" />
    </linearGradient>
    <linearGradient id="pyrLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#05131f" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="pyrRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#1a0d05" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Chamfered MAGI octagon plate -->
  <polygon
    points="16,4 48,4 60,16 60,48 48,60 16,60 4,48 4,16"
    fill="#050811"
    stroke="url(#rimGrad)"
    stroke-width="2.8"
    stroke-linejoin="miter"
  />

  <!-- Inset top-corner HUD targeting brackets -->
  <path d="M21,8.5 L17.5,8.5 L8.5,17.5 L8.5,21" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="square" />
  <path d="M43,8.5 L46.5,8.5 L55.5,17.5 L55.5,21" fill="none" stroke="#ff7b00" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="square" />

  <!-- Radiating RF broadcast waves from apex -->
  <path
    d="M22,20 A12,12 0 0,1 42,20"
    fill="none"
    stroke="#ff7b00"
    stroke-width="3.2"
    stroke-linecap="round"
  />
  <path
    d="M16,15.5 A20,20 0 0,1 48,15.5"
    fill="none"
    stroke="#00f0ff"
    stroke-width="2.8"
    stroke-linecap="round"
  />

  <!-- Pyramid shaded facets -->
  <polygon points="32,24 14,51.5 32,41" fill="url(#pyrLeft)" />
  <polygon points="32,24 50,51.5 32,41" fill="url(#pyrRight)" />
  <polygon points="14,51.5 50,51.5 32,41" fill="#140710" fill-opacity="0.85" />

  <!-- Internal P2P mesh struts -->
  <line x1="32" y1="24" x2="32" y2="41" stroke="#00f0ff" stroke-width="2.2" stroke-opacity="0.9" />
  <line x1="14" y1="51.5" x2="32" y2="41" stroke="#ff7b00" stroke-width="2.2" stroke-opacity="0.9" />
  <line x1="50" y1="51.5" x2="32" y2="41" stroke="#ff7b00" stroke-width="2.2" stroke-opacity="0.9" />

  <!-- Outer pyramid frame -->
  <polygon
    points="32,24 50,51.5 14,51.5"
    fill="none"
    stroke="#00f0ff"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Mesh vertex nodes -->
  <circle cx="32" cy="24" r="3" fill="#ffd000" stroke="#050811" stroke-width="1" />
  <circle cx="14" cy="51.5" r="2.8" fill="#00f0ff" stroke="#050811" stroke-width="1" />
  <circle cx="50" cy="51.5" r="2.8" fill="#ff7b00" stroke="#050811" stroke-width="1" />

  <!-- Central transmitter core -->
  <circle cx="32" cy="41" r="4.8" fill="#ff003c" stroke="#050811" stroke-width="1.2" />
  <circle cx="32" cy="41" r="2" fill="#ffd000" />
</svg>
